name: build-windows

# 在 GitHub 的 Windows 机器上编译图形界面版 exe
# （本机是 Mac，PyInstaller 不能跨平台编译，所以借 GitHub Actions 的 windows-latest）
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller packaging

      - name: 编译 exe（无控制台窗口）
        working-directory: source
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AGPatch --icon icon.ico --paths . --hidden-import packaging --hidden-import packaging.version gui_main.py

      - name: 检查产物
        working-directory: source
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist/AGPatch.exe")) { throw "AGPatch.exe 没生成" }

      - uses: actions/upload-artifact@v4
        with:
          name: AGPatch-windows
          path: source/dist/AGPatch.exe
          if-no-files-found: error

      - name: 附到 Release（打 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: source/dist/AGPatch.exe
